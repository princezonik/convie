services:

  convie:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: convie

    working_dir: /var/www

    volumes:
      - ./convie:/var/www

    networks:
      - laravel

  nginx:
    image: nginx:latest

    container_name: laravel_nginx

    ports:
      - "8000:80"

    volumes:
      - ./convie:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - convie

    networks:
      - laravel

  mysql:
    image: mysql:8.4

    container_name: laravel_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: convie
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: convie
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  redis:
    image: redis:latest

    container_name: laravel_redis

    ports:
      - "6379:6379"

    networks:
      - laravel

  auth_mysql:
    image: mysql:8.4

    container_name: auth_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: auth
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: auth
      MYSQL_PASSWORD: auth

    ports:
      - "3307:3306"

    volumes:
      - auth_mysql_data:/var/lib/mysql

    networks:
      - laravel

  auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    container_name: auth_service

    working_dir: /var/www

    volumes:
      - ./services/auth-service:/var/www

    depends_on:
      - auth_mysql

    networks:
      - laravel
volumes:
  mysql_data:
  auth_mysql_data:

networks:
  laravel:
    driver: bridge
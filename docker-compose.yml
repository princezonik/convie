services:

  convie:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: convie

    working_dir: /var/www

    volumes:
      - ./app:/var/www

    networks:
      - laravel

  nginx:
    image: nginx:latest

    container_name: laravel_nginx

    ports:
      - "8000:80"

    volumes:
      - ./app:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - convie

    networks:
      - laravel

  mysql:
    image: mysql:8.4

    container_name: laravel_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: convie
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: convie
      MYSQL_PASSWORD: convie

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  redis:
    image: redis:latest

    container_name: laravel_redis

    ports:
      - "6379:6379"

    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge
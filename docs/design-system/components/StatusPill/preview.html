<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusPill — preview</title></head>
<body>
<div id="root" class="cv-root"></div>
<script>
  var C = window.Convie, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'cv-stack',style:{gap:12}},[['paid','delivered','paid-out','verified','live'],['pending','awaiting-review','on-hold','confirming','awaiting-shipment'],['shipped','in-transit','scheduled','open'],['failed','declined','disputed','rejected','break'],['refunded','draft','cancelled','new-vendor']].map(function(r,i){return h('div',{key:i,className:'cv-row'},r.map(function(s){return h(C.StatusPill,{key:s,status:s})}))})));
</script>
</body>
</html>

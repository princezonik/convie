<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatusPill · Convie</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../components/bundle.js"></script>
<meta charset="utf-8"></head>
<body>

<div id="root" class="cv-root"></div>
<script>
  var C = window.Convie, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'cv-stack',style:{gap:12}},[['paid','delivered','paid-out','verified','live'],['pending','awaiting-review','on-hold','confirming','awaiting-shipment'],['shipped','in-transit','scheduled','open'],['failed','declined','disputed','rejected','break'],['refunded','draft','cancelled','new-vendor']].map(function(r,i){return h('div',{key:i,className:'cv-row'},r.map(function(s){return h(C.StatusPill,{key:s,status:s})}))})));
</script>

</body>
</html>
